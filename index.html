<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ростовские окна · Коммерческие предложения</title>
<meta name="theme-color" content="#B50900">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" href="assets/app.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/logo-color.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="logo-mark"><img src="assets/logo-color.png" alt="Ростовские окна"></span>
      <span class="brand-text">Ростовские&nbsp;окна<small>конструктор КП</small></span>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">v0.1 · локальная версия</div>
  </aside>
  <main id="view"></main>
</div>
<script>
// Авто-восстановление при зависшем service worker: если приложение не загрузилось за 5 c
// (меню пустое), один раз за сессию сбрасываем SW и кэш и перезагружаемся.
// IndexedDB (личные КП) НЕ трогаем.
(function(){
  setTimeout(function(){
    if (document.querySelector('#nav button')) return;       // приложение загрузилось — всё ок
    if (sessionStorage.getItem('kp-selfheal')) return;        // уже пробовали в этой сессии
    sessionStorage.setItem('kp-selfheal', '1');
    var fin = function(){ location.reload(); };
    var jobs = [];
    try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); } catch(e){}
    try { if (window.caches && caches.keys)
      jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); } catch(e){}
    Promise.all(jobs).then(fin, fin);
  }, 5000);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
